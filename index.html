<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
button{position:absolute;display:none;left:50%;bottom:25%;transform:translateX(-50%);
width:42%; min-height:8.9%; padding:10px 18px; border:0; border-radius:8px;
background:#f2c500;color:#111;font:700 18px Arial,sans-serif;cursor:pointer;z-index:10}
</style>
</head>
<body>
<video id="v" controls playsinline preload="metadata">
<source src="REINDUCCION_COMITE_2026.mp4" type="video/mp4">
</video>
<button id="eval">INICIAR EVALUACIÓN</button>
<script>
const v=document.getElementById('v'), b=document.getElementById('eval');
const url='https://docs.google.com/forms/d/e/1FAIpQLSfsQTIlcjpoPS8OH6d9ebqZd2EpuQxzOUKTz_Ifu2S357__Gg/viewform';
function show(){b.style.display='block'}
v.addEventListener('timeupdate',()=>{if(v.duration && v.currentTime/v.duration>=0.90) show()});
v.addEventListener('ended',show);
b.addEventListener('click',()=>window.open(url,'_blank','noopener,noreferrer'));
</script>
</body>
</html>
